<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пульс — планировщик</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="BeelineSans-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="BeelineSans-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="bar1">
    <a class="logo" href="./" title="Пульс: планировщик">
      <svg class="mk" viewBox="0 0 40 40" aria-hidden="true"><rect x="4" y="8" width="22" height="6" rx="3" fill="#141414"/><rect x="12" y="17" width="24" height="6" rx="3" fill="#FFC800"/><rect x="7" y="26" width="16" height="6" rx="3" fill="#141414"/><rect x="26" y="26" width="10" height="6" rx="3" fill="#FFC800"/></svg>
      <span class="ln">Пульс<small>планировщик для диспетчера · билайн бизнес</small></span>
    </a>
    <div class="scn">
      <button class="scn-nav" id="scn-prev" title="Предыдущий сценарий" aria-label="Предыдущий сценарий"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="scn-face" id="scn-face" aria-haspopup="listbox" aria-expanded="false" aria-controls="scn-menu"><span class="scn-txt"><span class="scn-g"><span id="scn-g">Сценарий</span><span class="scn-n" id="scn-n"></span></span>
        <span class="scn-t" id="scn-t"></span></span><span class="scn-chev"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>
      <select id="scn" class="scn-native" aria-label="Сценарий" tabindex="-1"></select>
      <div class="scn-menu hidden" id="scn-menu" role="listbox" aria-label="Сценарии"></div>
      <button class="scn-nav" id="scn-next" title="Следующий сценарий" aria-label="Следующий сценарий"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="acts">
      <button class="helpbtn" id="tour-btn" title="Как устроен экран" aria-label="Как устроен экран">?</button>
      <button class="btn primary hidden" id="ev-btn" title="Ввести событие и пересчитать план">＋ Событие</button>
      <a class="engbtn" id="eng-link" href="engineer.html" title="Маршрут бригады на телефоне" aria-label="Экран инженера"><svg class="ph" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="1.5" width="14" height="21" rx="3.2" fill="#141414"/><rect x="6.8" y="4.2" width="10.4" height="13.6" rx="1.4" fill="#FFC800"/><path d="M8.9 15.2l2.4-3.1 2.1 1.4 2.3-4.1" fill="none" stroke="#141414" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="15.7" cy="9.4" r="1.1" fill="#141414"/><rect x="10" y="19.4" width="4" height="1.3" rx=".65" fill="#FFC800"/></svg><span>Экран инженера</span></a>
    </div>
  </div>
  <div class="bar2">
    <div class="ctx" id="ctx" aria-live="polite"></div>
  </div>
</header>
<main>
  <a class="skip" href="#play-bar" id="skip-tl">Перейти к шкале</a>
  <section class="kpiwrap" aria-label="Главные цифры">
    <div class="kpis" id="kpis"></div>
    <div class="chips" id="chips"></div>
  </section>
  <section class="mid">
    <div class="card mapcard"><div id="map"></div>
      <div id="play-panel" class="over hidden"></div>
      <div id="cov-box" class="over card covbox hidden"><label><input type="checkbox" id="cov-on"> Покрытие аварий</label>
        <div id="cov-ctl" class="hidden"><input id="cov-range" type="range" min="0" max="23" step="1" aria-label="Время дня для покрытия аварий"><span id="cov-time" class="mono"></span>
          <div class="covleg"><i style="background:#14141433"></i>≤1 ч <i style="background:#FFC80080"></i>1–2 ч <i style="background:#D92D2073"></i>&gt;2 ч</div></div></div>
      <div id="map-leg" class="over legend" aria-label="Обозначения на карте"></div>
      <div id="play-bar" class="over card">
        <button class="btn primary" id="play-btn">Пуск</button>
        <div class="tl"><input id="play-range" type="range" min="0" max="720" step="2" value="0" aria-label="Время дня">
          <button class="tl-ev hidden" id="tl-ev"></button>
          <div class="tl-ticks" id="tl-ticks" aria-hidden="true"></div></div>
        <span id="play-time" class="mono"></span>
        <button class="btn hidden" id="play-all">Весь день</button>
      </div>
    </div>
    <aside class="side">
      <div class="card" id="panel"></div>
    </aside>
  </section>
  <section class="card" id="gantt-card"><div id="gantt"></div></section>
  <section class="card" id="brigades" aria-label="Бригады"></section>
  <section class="bottom">
    <div class="card" id="unassigned"></div>
    <div class="card" id="compare"></div>
  </section>
  <footer>Время в пути — по дорогам OpenStreetMap; для машины с поправкой на пробки и подход к двери.
    Базовый вариант: заявки раздаются бригадам по очереди, без планирования.</footer>
</main>
<div id="drag-tip" class="dragtip hidden"></div>
<script src="status.js"></script>
<script src="app.js"></script>
</body>
</html>
